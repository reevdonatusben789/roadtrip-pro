<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadTrip Pro - Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="page-shell admin-shell">
    <section class="hero">
      <h2>Admin Login</h2>
      <p>Use an admin account to manage users, trips, pricing, and platform settings.</p>
    </section>

    <form id="adminLoginForm" class="admin-form">
      <label for="adminEmail">Email</label>
      <input type="email" id="adminEmail" placeholder="admin@roadtrippro.com" required>

      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" placeholder="••••••••" required>

      <div id="adminError" class="admin-error" aria-live="polite"></div>

      <button type="submit" class="primary">Login</button>
      <button type="button" class="secondary" id="backToLanding">Back to User Login</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFlU1UPopFF5TUbJrbpf75pUiHWUdSi1g",
      authDomain: "road-trip-81e23.firebaseapp.com",
      projectId: "road-trip-81e23",
      storageBucket: "road-trip-81e23.appspot.com",
      messagingSenderId: "197527602150",
      appId: "1:197527602150:web:8b5fed66fb32cf4086cc27",
      measurementId: "G-E3NGKNHJKQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const adminLoginForm = document.getElementById("adminLoginForm");
    const adminError = document.getElementById("adminError");
    const backToLanding = document.getElementById("backToLanding");

    async function approveAdminAccess(user) {
      const token = await user.getIdTokenResult();
      if (token.claims && token.claims.role === "admin") {
        return true;
      }

      const ref = doc(db, "users", user.uid);
      const snapshot = await getDoc(ref);
      return snapshot.exists() && (snapshot.data().role === "admin");
    }

    adminLoginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      adminError.textContent = "";

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        const isAdmin = await approveAdminAccess(result.user);

        if (!isAdmin) {
          await signOut(auth);
          sessionStorage.removeItem("roadTripProAdminLoggedIn");
          adminError.textContent = "Access denied. Only admin users can access this dashboard.";
          return;
        }

        sessionStorage.setItem("roadTripProAdminLoggedIn", "true");
        window.location.href = "admin-dashboard.html";
      } catch (error) {
        adminError.textContent = error.message || "Login failed.";
      }
    });

    backToLanding.addEventListener("click", () => {
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
