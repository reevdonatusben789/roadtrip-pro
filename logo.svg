<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="url(#bgGradient)"/>
  
  <!-- Mountains -->
  <path d="M 20 85 L 35 50 L 50 70 L 70 35 L 95 80 Z" fill="#1e3a8a" opacity="0.6"/>
  <path d="M 25 85 L 40 55 L 55 75 L 75 40 L 100 85 Z" fill="#1e40af" opacity="0.4"/>
  
  <!-- Road curve -->
  <path d="M 30 90 Q 45 70 60 55 Q 75 40 95 35" stroke="url(#roadGradient)" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Sun/circle -->
  <circle cx="85" cy="25" r="8" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Highlight -->
  <rect width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
</svg>